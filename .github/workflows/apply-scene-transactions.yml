name: Apply scene filesystem and database transactions

on:
  pull_request:
    paths:
      - "APPLY_SCENE_TRANSACTIONS.md"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'automation/apply-scene-transactions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/scene-filesystem-db-transactions
          fetch-depth: 0

      - name: Apply exact patch
        run: |
          set -euo pipefail
          cat .scene-transaction-patch/part* > /tmp/scene-transactions.patch
          git apply --check /tmp/scene-transactions.patch
          git apply /tmp/scene-transactions.patch

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate transactions
        run: |
          python -m compileall -q tools skill tests
          python -m unittest discover -s tests -v
          python - <<'PY'
          from pathlib import Path
          clip = Path('tools/teambuilding-video-scene-library/src/tb_scene/clip_renamer.py').read_text(encoding='utf-8-sig')
          visual = Path('tools/teambuilding-video-scene-library/src/tb_scene/visual_corrector.py').read_text(encoding='utf-8-sig')
          cli = Path('tools/teambuilding-video-scene-library/src/tb_scene/cli.py').read_text(encoding='utf-8-sig')
          for marker in ['BEGIN IMMEDIATE', 'confirm_token', 'filesystem rollback was incomplete']:
              if marker not in clip:
                  raise SystemExit(f'clip renamer missing transaction marker: {marker}')
          for marker in ['apply: bool = False', 'BEGIN IMMEDIATE', 'cleanup_created_directories', 'confirm_token']:
              if marker not in visual:
                  raise SystemExit(f'visual corrector missing transaction marker: {marker}')
          for marker in ['--confirm-token', '--rename-after']:
              if marker not in cli:
                  raise SystemExit(f'CLI missing transaction option: {marker}')
          PY
          git diff --check

      - name: Commit verified changes
        run: |
          set -euo pipefail
          rm -rf .scene-transaction-patch .scene-transaction-payload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep scene files and SQLite records transactional"
          git push origin HEAD:fix/scene-filesystem-db-transactions
