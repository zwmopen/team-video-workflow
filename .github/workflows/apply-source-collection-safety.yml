name: Apply source collection safety patch

on:
  pull_request:
    paths:
      - "APPLY_SOURCE_COLLECTION_SAFETY.md"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'automation/apply-source-collection-safety'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/source-collection-safety
          fetch-depth: 0

      - name: Decode and apply verified patch
        shell: bash
        env:
          PATCH_GZ_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/source-collection-safety.patch
          git apply --check /tmp/source-collection-safety.patch
          git apply /tmp/source-collection-safety.patch

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate patch
        run: |
          python -m compileall -q tools skill tests
          python -m unittest discover -s tests -v
          python - <<'PY'
          from pathlib import Path
          collector = Path('tools/teambuilding-video-scene-library/src/tb_scene/source_collector.py').read_text(encoding='utf-8-sig')
          if '.unlink(' in collector or 'delete_source_duplicate' in collector:
              raise SystemExit('Permanent duplicate deletion remains in source collector')
          if 'move_files: bool = False' not in collector:
              raise SystemExit('Source collector is not Preview-first')
          PY
          git diff --check

      - name: Commit verified changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make source collection preview-first and transactional"
          git push origin HEAD:fix/source-collection-safety
