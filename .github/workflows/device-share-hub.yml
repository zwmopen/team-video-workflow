name: Device Share Hub

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/device-share-hub/**'
      - '.github/workflows/device-share-hub.yml'
      # 纯文档/忽略规则的改动不触发五连构建与产物发布：
      # 既省跑批，也避免仅改文档就把别人刚发出去的同一版本产物 --clobber 覆盖掉。
      - '!tools/device-share-hub/*.md'
      - '!tools/device-share-hub/**/*.md'
      - '!tools/device-share-hub/.gitignore'
  pull_request:
    branches: [main]
    paths:
      - 'tools/device-share-hub/**'
      - '.github/workflows/device-share-hub.yml'
      - '!tools/device-share-hub/*.md'
      - '!tools/device-share-hub/**/*.md'
      - '!tools/device-share-hub/.gitignore'

# 同一分支只保留最新一次构建，避免两次 push 的 publish-gallery-updates 并发 clobber 同一 tag 产物。
concurrency:
  group: device-share-hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remote-relay-check:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: tools/device-share-hub/remote-relay
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/device-share-hub/remote-relay/package-lock.json
      - name: Install exact relay dependencies
        run: |
          # package.json 的 overrides 已强制 sharp 0.35.4（修 GHSA-g89c-p67h-r497 /
          # GHSA-2jg2-4ch7-h545），lockfile 已在本地同版本 npm 下重生成并提交。
          # 这里只做校验：lockfile 若与 package.json 漂移就立即失败，
          # 而不是静默产出新 lockfile（那样 CI 永远绿、本地永远旧）。
          npm install --no-audit --no-fund
          if ! git diff --exit-code --quiet package-lock.json; then
            echo "::error::package-lock.json 已漂移 —— 请在本机 npm install 后提交新 lockfile"
            git --no-pager diff --stat -- package-lock.json
            exit 1
          fi
      - name: Audit, test and validate relay package
        run: |
          npm audit --audit-level=high
          npm run check
          npm run typecheck
          npm test
          npx wrangler deploy --dry-run
      - name: Exercise local Worker, Durable Object and R2
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --port 8791 > "$RUNNER_TEMP/device-share-relay.log" 2>&1 &
          relay_pid=$!
          trap 'kill "$relay_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8791/v1/health >/dev/null; then
              break
            fi
            if ! kill -0 "$relay_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/device-share-relay.log"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8791/v1/health >/dev/null
          npm run test:http || {
            cat "$RUNNER_TEMP/device-share-relay.log"
            exit 1
          }

  remote-relay-live-e2e:
    needs: remote-relay-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/device-share-hub/remote-relay
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/device-share-hub/remote-relay/package-lock.json
      - name: Install exact relay dependencies
        run: npm ci
      - name: Exercise deployed Cloudflare Worker, R2 and P2P signaling
        env:
          ALBUM_RELAY_ENDPOINT: https://zwm-device-share-relay.zwmrpg.workers.dev
        run: node scripts/cloudflare-e2e.mjs

  windows-portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify mobile update retry and inventory beacon rules
        run: node tools/device-share-hub/scripts/verify-auto-mobile-update.mjs
      - name: Verify P2P ICE and ACK invariants
        run: node tools/device-share-hub/scripts/verify-p2p-invariants.mjs
      # 【2026-09-23 新增】这条守卫此前长期为红（断言的是 DSH-091 C3 之前的旧 `platformRow1` 结构）
      # 且**从未被 CI 调用** —— 等于没有守卫。已修到当前结构，并顺带锁定本次新增的三条不变量：
      # ① Android 多版本原样返回解析结果（按钮顺序 = 文案块顺序，不 rank、不摘项）；
      # ② 版本名不截断到 4 字；③ iOS 平台行 `rowHeight` 与 `sizeForItemAt` 同源。
      - name: Verify work card UI parity
        run: node tools/device-share-hub/scripts/verify-work-card-ui.mjs
      # 【2026-09-23 新增】源码级两端对等契约（C1~C16 + A1~A3）。同样**此前从未被 CI 调用**。
      # 已加 utf-8 输出兜底，Windows runner 的非 UTF-8 locale 下不会因打印 ✅ 而崩。
      # ⚠️ 本 job 是 publish-gallery-updates 的前置：这里红 ⇒ 整条发版链断。
      - name: Verify iOS / Android parity contract
        run: python tools/device-share-hub/tests/parity_ios_android.py
      - name: Build native Windows panel
        id: windows_compile
        shell: pwsh
        run: |
          vcpkg install libdatachannel:x64-windows-static --recurse
          if ($LASTEXITCODE -ne 0) { throw "libdatachannel vcpkg dependency installation failed" }
          $log = "$env:RUNNER_TEMP/device-share-windows-build.log"
          cmake -S tools/device-share-hub/windows-native -B tools/device-share-hub/windows-native/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            "status=1" >> $env:GITHUB_OUTPUT
            exit 0
          }
          cmake --build tools/device-share-hub/windows-native/build --config Release *>&1 | Tee-Object -FilePath $log -Append
          $status = $LASTEXITCODE
          if ($status -eq 0) {
            ctest --test-dir tools/device-share-hub/windows-native/build -C Release --output-on-failure *>&1 | Tee-Object -FilePath $log -Append
            $status = $LASTEXITCODE
          }
          "status=$status" >> $env:GITHUB_OUTPUT
          if ($status -eq 0) {
            New-Item -ItemType Directory -Force -Path tools/device-share-hub/windows-native/out | Out-Null
            $version = (Select-String -Path tools/device-share-hub/windows-native/src/main.cpp -Pattern 'APP_VERSION\[\]\s*=\s*L"([^"]+)"').Matches.Groups[1].Value
            if ([string]::IsNullOrWhiteSpace($version)) { throw "Windows APP_VERSION not found" }
            Copy-Item "tools/device-share-hub/windows-native/build/Release/素材投送中控.exe" "tools/device-share-hub/windows-native/out/文件收发中控-Windows-V$version.exe"
            Copy-Item "tools/device-share-hub/README.md" "tools/device-share-hub/windows-native/out/使用说明.md"
          }
          exit 0
      - name: Upload Windows build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-share-hub-windows-build-log
          path: ${{ runner.temp }}/device-share-windows-build.log
      - name: Upload Windows portable panel
        if: steps.windows_compile.outputs.status == '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-share-hub-windows-portable
          path: tools/device-share-hub/windows-native/out/
      - name: Fail when Windows build failed
        if: steps.windows_compile.outputs.status != '0'
        run: exit 1

  android-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: tools/device-share-hub/android
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK command line tools
        shell: bash
        run: |
          set -euo pipefail
          # android-actions/setup-android@v3 仍尝试安装已被移除的 SDK "tools" 包，直接失败。
          # 改为手动安装官方 commandlinetools，避免依赖废弃包。
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Guard removed screenshot and automatic clipboard surfaces
        run: node ../scripts/verify-removed-surfaces.mjs
      - name: Install Android platform and build tools
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Install Gradle 9.4.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.4.1-bin.zip -o /tmp/gradle-9.4.1-bin.zip
          unzip -q /tmp/gradle-9.4.1-bin.zip -d /tmp/gradle
      - name: Test, build and lint Android release APK
        id: android_compile
        shell: bash
        run: |
          set +e
          /tmp/gradle/gradle-9.4.1/bin/gradle :app:testDebugUnitTest :app:assembleRelease :app:lintRelease --stacktrace > /tmp/device-share-android-build.log 2>&1
          build_status=$?
          if [ "$build_status" -eq 0 ]; then
            apk="app/build/outputs/apk/release/app-release.apk"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk" >> /tmp/device-share-android-build.log 2>&1
            permissions=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk")
            if ! printf '%s\n' "$permissions" | grep -q 'android.permission.REQUEST_INSTALL_PACKAGES'; then
              echo "Release APK must declare REQUEST_INSTALL_PACKAGES for the verified app-owned installer" >> /tmp/device-share-android-build.log
              build_status=1
            fi
            if ! printf '%s\n' "$permissions" | grep -q 'android.permission.FOREGROUND_SERVICE_DATA_SYNC'; then
              echo "Release APK must declare FOREGROUND_SERVICE_DATA_SYNC for the update service" >> /tmp/device-share-android-build.log
              build_status=1
            fi
            for forbidden_permission in SYSTEM_ALERT_WINDOW READ_MEDIA_IMAGES READ_MEDIA_VIDEO READ_MEDIA_VISUAL_USER_SELECTED; do
              if printf '%s\n' "$permissions" | grep -q "uses-permission: name='android.permission.$forbidden_permission'"; then
                echo "Release APK must not declare removed privacy permission: $forbidden_permission" >> /tmp/device-share-android-build.log
                build_status=1
              fi
            done
            if printf '%s\n' "$permissions" | grep -q "uses-permission: name='android.permission.INSTALL_PACKAGES'"; then
              echo "Release APK must not declare privileged INSTALL_PACKAGES" >> /tmp/device-share-android-build.log
              build_status=1
            fi
            if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -q 'application-debuggable'; then
              echo "Release APK must not be debuggable" >> /tmp/device-share-android-build.log
              build_status=1
            fi
            if [ "$build_status" -eq 0 ]; then
              metadata="app/build/outputs/apk/release/output-metadata.json"
              version_name=$(jq -r '.elements[0].versionName' "$metadata")
              version_code=$(jq -r '.elements[0].versionCode' "$metadata")
              if [ -z "$version_name" ] || [ "$version_name" = "null" ] || [ -z "$version_code" ] || [ "$version_code" = "null" ]; then
                echo "Android output metadata does not contain versionName/versionCode" >> /tmp/device-share-android-build.log
                build_status=1
              else
                mkdir -p out
                apk_name="album-Android-v${version_name}.apk"
                cp "$apk" "out/$apk_name"
                sha256=$(sha256sum "out/$apk_name" | awk '{print $1}')
                printf '%s  %s\r\n' "$sha256" "$apk_name" > out/SHA256SUMS.txt
                jq -n \
                  --arg version_name "$version_name" \
                  --argjson version_code "$version_code" \
                  --arg file_name "$apk_name" \
                  --arg sha256 "$sha256" \
                  '{schema: 1, version_name: $version_name, version_code: $version_code, file_name: $file_name, sha256: $sha256}' \
                  > out/android-release-metadata.json
              fi
            fi
          fi
          echo "status=$build_status" >> "$GITHUB_OUTPUT"
          tail -n 180 /tmp/device-share-android-build.log
          exit 0
      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-share-hub-android-build-log
          path: /tmp/device-share-android-build.log
      - name: Upload signed release APK
        if: steps.android_compile.outputs.status == '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-share-hub-android-release
          path: tools/device-share-hub/android/out/
      - name: Fail when Android build failed
        if: steps.android_compile.outputs.status != '0'
        run: exit 1

  ios-altstore-build:
    runs-on: macos-15
    outputs:
      artifact_name: ${{ steps.ios_package.outputs.artifact_name }}
    defaults:
      run:
        working-directory: tools/device-share-hub/ios
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Guard removed screenshot and automatic clipboard surfaces
        run: node ../scripts/verify-removed-surfaces.mjs
      - name: Verify iOS simulator picker
        # 选模拟器的逻辑曾经是 YAML 里的 `python3 -c`，因缩进被当成 Python 缩进而
        # 崩溃，导致「永远找不到模拟器 -> 永远只编译不跑测试」。闸门本身必须有测试。
        run: python3 ../scripts/test_pick_ios_simulator.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned iPhone app
        id: ios_compile
        shell: bash
        run: |
          set +e
          marketing_version=$(awk -F': *' '/^[[:space:]]*MARKETING_VERSION:/ {print $2; exit}' project.yml | tr -d '"' | tr -d "'" | tr -d '\r\n' | xargs)
          build_version=$(awk -F': *' '/^[[:space:]]*CURRENT_PROJECT_VERSION:/ {print $2; exit}' project.yml | tr -d '"' | tr -d "'" | tr -d '\r\n' | xargs)
          xcrun simctl list devices available -j > "$RUNNER_TEMP/sim-devices.json" 2>"$RUNNER_TEMP/sim-devices.err"
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/sim-runtimes.json" 2>"$RUNNER_TEMP/sim-runtimes.err"
          xcrun simctl list devicetypes -j > "$RUNNER_TEMP/sim-devicetypes.json" 2>"$RUNNER_TEMP/sim-devicetypes.err"
          # 选择逻辑必须放在独立脚本里：YAML block scalar 会给每一行加缩进，
          # 而 `python3 -c '<indented code>'` 会 IndentationError、stdout 为空
          # —— 这正是之前「永远找不到模拟器、永远只编译不跑测试」的根因。
          sim_plan=$(python3 ../scripts/pick_ios_simulator.py \
            --devices "$RUNNER_TEMP/sim-devices.json" \
            --runtimes "$RUNNER_TEMP/sim-runtimes.json" \
            --devicetypes "$RUNNER_TEMP/sim-devicetypes.json")
          simulator_id=""
          case "$sim_plan" in
            device:*)
              simulator_id=${sim_plan#device:}
              echo "reusing simulator: $simulator_id"
              ;;
            create:*)
              create_args=${sim_plan#create:}
              runtime_id=${create_args%%$'\t'*}
              device_type=${create_args##*$'\t'}
              simulator_id=$(xcrun simctl create "DSH-CI-iPhone" "$device_type" "$runtime_id")
              echo "created simulator: $simulator_id ($device_type / $runtime_id)"
              xcrun simctl boot "$simulator_id"
              xcrun simctl bootstatus "$simulator_id" -b
              ;;
            *)
              echo "----- simctl diagnostics (stderr of the picker) -----"
              cat "$RUNNER_TEMP/sim-devices.err"
              cat "$RUNNER_TEMP/sim-runtimes.err"
              ;;
          esac
          if [ -n "$simulator_id" ]; then
            xcodebuild \
              -project Album.xcodeproj \
              -scheme Album \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination "id=$simulator_id" \
              MARKETING_VERSION="$marketing_version" \
              CURRENT_PROJECT_VERSION="$build_version" \
              test > "$RUNNER_TEMP/device-share-ios-build.log" 2>&1
            test_status=$?
            {
              echo "### iOS unit tests: executed"
              echo ""
              echo "Simulator: $simulator_id"
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "Executed [0-9]+ test" "$RUNNER_TEMP/device-share-ios-build.log" \
              | tail -n 5 >> "$GITHUB_STEP_SUMMARY" || true
            if ! grep -qE "Executed [0-9]+ test" "$RUNNER_TEMP/device-share-ios-build.log"; then
              echo "::warning::No 'Executed N test' line in the xcodebuild log - XCTest may not have run."
              echo "**WARNING**: no 'Executed N test' line - XCTest may not have run." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::iOS unit tests NOT executed: no bootable iPhone simulator on this runner."
            {
              echo "### iOS unit tests: NOT executed"
              echo ""
              echo "No bootable iPhone simulator was available and none could be created, so this job"
              echo "only compiled the app and the test bundle (build-for-testing). The green check below"
              echo "means \"it compiles\", NOT \"the unit tests pass\"."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "No bootable iPhone simulator on this runner; compiling the app and test bundle." > "$RUNNER_TEMP/device-share-ios-build.log"
            xcodebuild \
              -project Album.xcodeproj \
              -scheme Album \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              MARKETING_VERSION="$marketing_version" \
              CURRENT_PROJECT_VERSION="$build_version" \
              build-for-testing >> "$RUNNER_TEMP/device-share-ios-build.log" 2>&1
            test_status=$?
          fi
          xcodebuild \
            -project Album.xcodeproj \
            -scheme Album \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$marketing_version" \
            CURRENT_PROJECT_VERSION="$build_version" \
            build >> "$RUNNER_TEMP/device-share-ios-build.log" 2>&1
          build_status=$?
          if [ "$test_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then status=1; else status=0; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "----- XCTest summary (grep from the full log) -----"
          grep -E "Executed [0-9]+ test|TEST SUCCEEDED|TEST FAILED|Failing tests|Failed tests" "$RUNNER_TEMP/device-share-ios-build.log" | tail -n 10
          tail -n 180 "$RUNNER_TEMP/device-share-ios-build.log"
          exit 0
      - name: Package AltStore IPA
        id: ios_package
        if: steps.ios_compile.outputs.status == '0'
        shell: bash
        run: |
          app_path="build/Build/Products/Release-iphoneos/Album.app"
          test -d "$app_path"
          marketing_version=$(awk -F': *' '/^[[:space:]]*MARKETING_VERSION:/ {print $2; exit}' project.yml | tr -d '"' | tr -d "'" | tr -d '\r\n' | xargs)
          build_version=$(awk -F': *' '/^[[:space:]]*CURRENT_PROJECT_VERSION:/ {print $2; exit}' project.yml | tr -d '"' | tr -d "'" | tr -d '\r\n' | xargs)
          if [ -z "$marketing_version" ] || [ -z "$build_version" ]; then
            echo "Unable to read iOS marketing/build version from project.yml" >&2
            exit 1
          fi
          ipa_name="album-iOS-v${marketing_version}-altstore.ipa"
          artifact_name="album-ios-altstore-v${marketing_version}"
          rm -rf package
          mkdir -p package/Payload
          ditto "$app_path" "package/Payload/Album.app"
          (cd package && /usr/bin/zip -qry "../$ipa_name" Payload)
          IPA_NAME="$ipa_name" MARKETING_VERSION="$marketing_version" BUILD_VERSION="$build_version" python3 - <<'PY'
          import plistlib
          import zipfile
          import os

          ipa = os.environ["IPA_NAME"]
          expected_version = os.environ["MARKETING_VERSION"]
          expected_build = os.environ["BUILD_VERSION"]
          with zipfile.ZipFile(ipa) as archive:
              names = archive.namelist()
              assert "Payload/Album.app/Album" in names, "iOS executable missing"
              assert all(name.isascii() for name in names), "IPA contains non-ASCII paths"
              info = plistlib.loads(archive.read("Payload/Album.app/Info.plist"))
              assert info["CFBundleExecutable"] == "Album"
              assert info["CFBundleDisplayName"] == "相册"
              assert info["CFBundleShortVersionString"] == expected_version
              assert info["CFBundleVersion"] == expected_build
          print("IPA structure verified")
          PY
          shasum -a 256 "$ipa_name" > "${ipa_name}.sha256"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$ipa_name" >> "$GITHUB_OUTPUT"
      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-share-hub-ios-build-log
          path: ${{ runner.temp }}/device-share-ios-build.log
      - name: Upload AltStore IPA
        if: steps.ios_compile.outputs.status == '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.ios_package.outputs.artifact_name }}
          path: |
            tools/device-share-hub/ios/album-iOS-v*-altstore.ipa
            tools/device-share-hub/ios/album-iOS-v*-altstore.ipa.sha256
      - name: Fail when iOS build failed
        if: steps.ios_compile.outputs.status != '0'
        run: exit 1

  publish-gallery-updates:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows-portable, android-build, ios-altstore-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download Android release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: device-share-hub-android-release
          path: release/android
      - name: Download Windows portable bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: device-share-hub-windows-portable
          path: release/windows
      - name: Download iOS AltStore bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.ios-altstore-build.outputs.artifact_name }}
          path: release/ios
      - name: Publish verified Android and iOS versions to gallery-updates
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GALLERY_UPDATES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing GALLERY_UPDATES_TOKEN. Add a repo-scoped token with write access to zwmopen/gallery-updates."
            exit 1
          fi

          metadata="release/android/android-release-metadata.json"
          apk_name=$(jq -r '.file_name' "$metadata")
          version_name=$(jq -r '.version_name' "$metadata")
          version_code=$(jq -r '.version_code' "$metadata")
          sha256=$(jq -r '.sha256' "$metadata")
          apk="release/android/$apk_name"
          sums="release/android/SHA256SUMS.txt"
          test -f "$apk"
          test -f "$sums"
          test "$(sha256sum "$apk" | awk '{print $1}')" = "$sha256"

          ios_ipa=$(find release/ios -maxdepth 1 -type f -name 'album-iOS-v*-altstore.ipa' -print -quit)
          test -n "$ios_ipa"
          ios_ipa_name=$(basename "$ios_ipa")
          ios_sums="${ios_ipa}.sha256"
          test -f "$ios_sums"
          ios_version_name=$(awk -F': *' '/^[[:space:]]*MARKETING_VERSION:/ {print $2; exit}' \
            tools/device-share-hub/ios/project.yml | tr -d '"' | tr -d "'" | tr -d '\r\n' | xargs)
          ios_build=$(awk -F': *' '/^[[:space:]]*CURRENT_PROJECT_VERSION:/ {print $2; exit}' \
            tools/device-share-hub/ios/project.yml | tr -d '"' | tr -d "'" | tr -d '\r\n' | xargs)
          test -n "$ios_version_name"
          test -n "$ios_build"
          test "$ios_ipa_name" = "album-iOS-v${ios_version_name}-altstore.ipa"
          ios_sha256=$(awk '{print $1}' "$ios_sums")
          test "$(sha256sum "$ios_ipa" | awk '{print $1}')" = "$ios_sha256"

          repo="zwmopen/gallery-updates"
          tag="v${version_name}"
          apk_url="https://github.com/${repo}/releases/download/${tag}/${apk_name}"
          ios_ipa_url="https://github.com/${repo}/releases/download/${tag}/${ios_ipa_name}"
          release_url="https://github.com/${repo}/releases/tag/${tag}"
          source_file="altstore.json"
          source_url="https://raw.githubusercontent.com/${repo}/main/${source_file}"
          source_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ios_ipa_size=$(stat -c%s "$ios_ipa")
          if ! gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$repo" \
              --title "相册 Android ${version_name} / iPhone ${ios_version_name}" \
              --notes "Published from zwmopen/team-video-workflow commit ${GITHUB_SHA}. Android versionCode=${version_code}; iPhone build=${ios_build}."
          fi
          # 源码快照：跟着安装包一起发。发布仓库的 README 早就写了「发布页同时提供显式源码 ZIP」，
          # 但这一步一直没做 —— 名不副实。补上之后 Release 页面直接就有「构建出这批包的那一版源码」，
          # 不用再去主仓库翻 commit。只收 tools/device-share-hub，排除构建产物。
          source_zip="release/device-share-hub-source-${version_name}.zip"
          (cd tools && zip -qr "../${source_zip}" device-share-hub \
            -x '*/build/*' '*/out/*' '*/__pycache__/*' '*.pyc' '*/.gradle/*')
          test -s "$source_zip"
          echo "源码快照 $(stat -c%s "$source_zip") 字节"

          # Windows 便携版：以前只留在 Actions artifact 里 —— 要登录 GitHub 才能下、
          # 90 天还会过期，Release 页面上根本找不到。而电脑端和手机端一样是要发的东西，
          # 现在跟 APK / IPA 一起发。
          windows_exe=$(find release/windows -maxdepth 1 -type f -name '*.exe' -print -quit)
          windows_sha=""
          windows_version=""
          windows_sums=""
          windows_file_name=""
          if [ -n "$windows_exe" ]; then
            windows_file_name=$(basename "$windows_exe")
            windows_sha=$(sha256sum "$windows_exe" | awk '{print $1}')
            windows_version=$(sed -n 's/.*APP_VERSION\[\][^"]*L"\([^"]*\)".*/\1/p' \
              tools/device-share-hub/windows-native/src/main.cpp | head -1 | tr -d '\r\n')
            windows_sums="release/windows/Windows-SHA256.txt"
            printf '%s  %s\n' "$windows_sha" "$windows_file_name" > "$windows_sums"
            echo "Windows 包 ${windows_file_name}  V${windows_version}  sha256=${windows_sha:0:12}…"
          else
            echo "::warning::release/windows 里没找到 exe，本次不发布 Windows 包"
          fi

          uploads=("$apk" "$sums" "$ios_ipa" "$ios_sums" "$source_zip")
          if [ -n "$windows_exe" ]; then
            uploads+=("$windows_exe" "$windows_sums")
          fi
          gh release upload "$tag" --repo "$repo" "${uploads[@]}" --clobber

          # 中文文件名在 download URL 里会被 percent-encode，手写拼 URL 容易拼错，
          # 直接从上传结果里取真实地址。
          windows_url=""
          if [ -n "$windows_exe" ]; then
            windows_url=$(gh release view "$tag" --repo "$repo" --json assets \
              | python3 -c "import json,sys;d=json.load(sys.stdin);print(next((a['browser_download_url'] for a in d['assets'] if a['name'].endswith('.exe')),''))")
          fi

          current_json=$(curl --fail --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/${repo}/main/latest.json" || printf '{}')
          update_notes="相册 Android ${version_name}（versionCode ${version_code}）/ iOS ${ios_version_name}（build ${ios_build}）；源码提交 ${GITHUB_SHA}"
          updated_json=$(printf '%s' "$current_json" | jq \
            --arg notes "$update_notes" \
            --arg version_name "$version_name" \
            --argjson version_code "$version_code" \
            --arg sha256 "$sha256" \
            --arg apk_url "$apk_url" \
            --arg tag_name "$tag" \
            --arg html_url "$release_url" \
            --arg ios_version_name "$ios_version_name" \
            --argjson ios_build "$ios_build" \
            --arg ios_sha256 "$ios_sha256" \
            --arg ios_ipa_url "$ios_ipa_url" \
            --arg ios_ipa_name "$ios_ipa_name" \
            --arg ios_release_url "$release_url" \
            --arg windows_version "$windows_version" \
            --arg windows_sha "$windows_sha" \
            --arg windows_url "$windows_url" \
            --arg windows_file_name "$windows_file_name" \
            '.version_name=$version_name
             | .notes=$notes
             | .version_code=$version_code
             | .versionName=$version_name
             | .versionCode=$version_code
             | .sha256=$sha256
             | .apk_url=$apk_url
             | .url=$apk_url
             | .tag_name=$tag_name
             | .html_url=$html_url
             | .ios={version_name:$ios_version_name, build:$ios_build, sha256:$ios_sha256,
                    ipa_url:$ios_ipa_url, ipa_file_name:$ios_ipa_name, release_url:$ios_release_url}
             | .windows={version:$windows_version, sha256:$windows_sha, url:$windows_url,
                        file_name:$windows_file_name, release_url:$html_url}')
          content=$(printf '%s' "$updated_json" | base64 -w0)
          latest_sha=$(gh api "repos/${repo}/contents/latest.json" --jq '.sha' 2>/dev/null || true)
          if [ -n "$latest_sha" ]; then
            gh api --method PUT "repos/${repo}/contents/latest.json" \
              --field message="release: publish Android ${version_name}" \
              --field branch=main \
              --field content="$content" \
              --field sha="$latest_sha" >/dev/null
          else
            gh api --method PUT "repos/${repo}/contents/latest.json" \
              --field message="release: publish Android ${version_name}" \
              --field branch=main \
              --field content="$content" >/dev/null
          fi

          current_source=$(curl --fail --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/${repo}/main/${source_file}" || printf '{}')
          updated_source=$(printf '%s' "$current_source" | python3 tools/device-share-hub/scripts/build-altstore-source.py \
            --version "$ios_version_name" \
            --build-version "$ios_build" \
            --date "$source_date" \
            --download-url "$ios_ipa_url" \
            --size "$ios_ipa_size" \
            --sha256 "$ios_sha256")
          source_content=$(printf '%s' "$updated_source" | base64 -w0)
          source_sha=$(gh api "repos/${repo}/contents/${source_file}" --jq '.sha' 2>/dev/null || true)
          if [ -n "$source_sha" ]; then
            gh api --method PUT "repos/${repo}/contents/${source_file}" \
              --field message="release: update AltStore source for iPhone ${ios_version_name}" \
              --field branch=main \
              --field content="$source_content" \
              --field sha="$source_sha" >/dev/null
          else
            gh api --method PUT "repos/${repo}/contents/${source_file}" \
              --field message="release: add AltStore source for iPhone ${ios_version_name}" \
              --field branch=main \
              --field content="$source_content" >/dev/null
          fi

          published=""
          for attempt in $(seq 1 10); do
            published_b64=$(gh api "repos/${repo}/contents/latest.json?ref=main" --jq '.content' 2>/dev/null | tr -d '\r\n' || true)
            if [ -n "$published_b64" ]; then
              published=$(printf '%s' "$published_b64" | base64 --decode 2>/dev/null || true)
            fi
            if [ "$(printf '%s' "$published" | jq -r '.version_name' 2>/dev/null || true)" = "$version_name" ] \
              && [ "$(printf '%s' "$published" | jq -r '.version_code' 2>/dev/null || true)" = "$version_code" ] \
              && [ "$(printf '%s' "$published" | jq -r '.versionName' 2>/dev/null || true)" = "$version_name" ] \
              && [ "$(printf '%s' "$published" | jq -r '.versionCode' 2>/dev/null || true)" = "$version_code" ] \
              && [ "$(printf '%s' "$published" | jq -r '.sha256' 2>/dev/null || true)" = "$sha256" ] \
              && [ "$(printf '%s' "$published" | jq -r '.ios.version_name' 2>/dev/null || true)" = "$ios_version_name" ] \
              && [ "$(printf '%s' "$published" | jq -r '.ios.build' 2>/dev/null || true)" = "$ios_build" ] \
              && [ "$(printf '%s' "$published" | jq -r '.ios.sha256' 2>/dev/null || true)" = "$ios_sha256" ]; then
              break
            fi
            if [ "$attempt" -lt 10 ]; then
              sleep 2
            fi
          done
          test "$(printf '%s' "$published" | jq -r '.version_name')" = "$version_name"
          test "$(printf '%s' "$published" | jq -r '.version_code')" = "$version_code"
          test "$(printf '%s' "$published" | jq -r '.versionName')" = "$version_name"
          test "$(printf '%s' "$published" | jq -r '.versionCode')" = "$version_code"
          test "$(printf '%s' "$published" | jq -r '.sha256')" = "$sha256"
          test "$(printf '%s' "$published" | jq -r '.ios.version_name')" = "$ios_version_name"
          test "$(printf '%s' "$published" | jq -r '.ios.build')" = "$ios_build"
          test "$(printf '%s' "$published" | jq -r '.ios.sha256')" = "$ios_sha256"
          source_published=""
          for attempt in $(seq 1 10); do
            source_b64=$(gh api "repos/${repo}/contents/${source_file}?ref=main" --jq '.content' 2>/dev/null | tr -d '\r\n' || true)
            if [ -n "$source_b64" ]; then
              source_published=$(printf '%s' "$source_b64" | base64 --decode 2>/dev/null || true)
            fi
            if [ "$(printf '%s' "$source_published" | jq -r '.apps[] | select(.bundleIdentifier == "com.zwm.album") | .versions[0].version' 2>/dev/null || true)" = "$ios_version_name" ] \
              && [ "$(printf '%s' "$source_published" | jq -r '.apps[] | select(.bundleIdentifier == "com.zwm.album") | .versions[0].buildVersion' 2>/dev/null || true)" = "$ios_build" ] \
              && [ "$(printf '%s' "$source_published" | jq -r '.apps[] | select(.bundleIdentifier == "com.zwm.album") | .versions[0].downloadURL' 2>/dev/null || true)" = "$ios_ipa_url" ]; then
              break
            fi
            if [ "$attempt" -lt 10 ]; then
              sleep 2
            fi
          done
          test "$(printf '%s' "$source_published" | jq -r '.apps[] | select(.bundleIdentifier == "com.zwm.album") | .versions[0].version')" = "$ios_version_name"
          test "$(printf '%s' "$source_published" | jq -r '.apps[] | select(.bundleIdentifier == "com.zwm.album") | .versions[0].buildVersion')" = "$ios_build"
          test "$(printf '%s' "$source_published" | jq -r '.apps[] | select(.bundleIdentifier == "com.zwm.album") | .versions[0].downloadURL')" = "$ios_ipa_url"
          raw_version=$(curl --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/${repo}/main/latest.json?run=${GITHUB_RUN_ID}" \
            | jq -r '.version_name' || true)
          if [ "$raw_version" != "$version_name" ]; then
            echo "::warning::Contents API is current; raw.githubusercontent.com is still propagating (read ${raw_version:-unavailable})."
          fi
          echo "Published and API-verified Android ${version_name} (versionCode ${version_code}) and iPhone ${ios_version_name} (build ${ios_build}) to ${repo}."
          echo "AltStore source: ${source_url}"
