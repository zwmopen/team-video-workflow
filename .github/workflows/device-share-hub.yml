name: Device Share Hub

on:
  push:
    paths:
      - 'tools/device-share-hub/**'
      - '.github/workflows/device-share-hub.yml'
  pull_request:
    paths:
      - 'tools/device-share-hub/**'
      - '.github/workflows/device-share-hub.yml'

jobs:
  desktop-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/device-share-hub/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.mjs

  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/device-share-hub/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: device-share-hub-debug-apk
          path: tools/device-share-hub/android/app/build/outputs/apk/debug/app-debug.apk
