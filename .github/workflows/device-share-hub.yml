name: Device Share Hub

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/device-share-hub/**'
      - '.github/workflows/device-share-hub.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/device-share-hub/**'
      - '.github/workflows/device-share-hub.yml'

jobs:
  remote-relay-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/device-share-hub/remote-relay
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/device-share-hub/remote-relay/package-lock.json
      - name: Install exact relay dependencies
        run: npm ci
      - name: Audit, test and validate relay package
        run: |
          npm audit --audit-level=high
          npm run check
          npm run typecheck
          npm test
          npx wrangler deploy --dry-run
      - name: Exercise local Worker, Durable Object and R2
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --port 8791 > "$RUNNER_TEMP/device-share-relay.log" 2>&1 &
          relay_pid=$!
          trap 'kill "$relay_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8791/v1/health >/dev/null; then
              break
            fi
            if ! kill -0 "$relay_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/device-share-relay.log"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8791/v1/health >/dev/null
          npm run test:http || {
            cat "$RUNNER_TEMP/device-share-relay.log"
            exit 1
          }

  windows-portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build native Windows panel
        id: windows_compile
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP/device-share-windows-build.log"
          cmake -S tools/device-share-hub/windows-native -B tools/device-share-hub/windows-native/build -G "Visual Studio 17 2022" -A x64 *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            "status=1" >> $env:GITHUB_OUTPUT
            exit 0
          }
          cmake --build tools/device-share-hub/windows-native/build --config Release *>&1 | Tee-Object -FilePath $log -Append
          $status = $LASTEXITCODE
          if ($status -eq 0) {
            ctest --test-dir tools/device-share-hub/windows-native/build -C Release --output-on-failure *>&1 | Tee-Object -FilePath $log -Append
            $status = $LASTEXITCODE
          }
          "status=$status" >> $env:GITHUB_OUTPUT
          if ($status -eq 0) {
            New-Item -ItemType Directory -Force -Path tools/device-share-hub/windows-native/out | Out-Null
            Copy-Item "tools/device-share-hub/windows-native/build/Release/素材投送中控.exe" "tools/device-share-hub/windows-native/out/文件收发中控-Windows-V4.3.3.exe"
            Copy-Item "tools/device-share-hub/README.md" "tools/device-share-hub/windows-native/out/使用说明.md"
          }
          exit 0
      - name: Upload Windows build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-share-hub-windows-build-log
          path: ${{ runner.temp }}/device-share-windows-build.log
      - name: Upload Windows portable panel
        if: steps.windows_compile.outputs.status == '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-share-hub-windows-portable
          path: tools/device-share-hub/windows-native/out/
      - name: Fail when Windows build failed
        if: steps.windows_compile.outputs.status != '0'
        run: exit 1

  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/device-share-hub/android
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@07976c6290703d34c16d382cb36445f98bb43b1f # v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install Gradle 9.4.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.4.1-bin.zip -o /tmp/gradle-9.4.1-bin.zip
          unzip -q /tmp/gradle-9.4.1-bin.zip -d /tmp/gradle
      - name: Test, build and lint Android release APK
        id: android_compile
        shell: bash
        run: |
          set +e
          /tmp/gradle/gradle-9.4.1/bin/gradle :app:testDebugUnitTest :app:assembleRelease :app:lintRelease --stacktrace > /tmp/device-share-android-build.log 2>&1
          build_status=$?
          if [ "$build_status" -eq 0 ]; then
            apk="app/build/outputs/apk/release/app-release.apk"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk" >> /tmp/device-share-android-build.log 2>&1
            if ! "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk" | grep -q 'android.permission.REQUEST_INSTALL_PACKAGES'; then
              echo "Release APK must declare REQUEST_INSTALL_PACKAGES for the verified app-owned installer" >> /tmp/device-share-android-build.log
              build_status=1
            fi
            if ! "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk" | grep -q 'android.permission.FOREGROUND_SERVICE_DATA_SYNC'; then
              echo "Release APK must declare FOREGROUND_SERVICE_DATA_SYNC for the update service" >> /tmp/device-share-android-build.log
              build_status=1
            fi
            if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk" | grep -q "uses-permission: name='android.permission.INSTALL_PACKAGES'"; then
              echo "Release APK must not declare privileged INSTALL_PACKAGES" >> /tmp/device-share-android-build.log
              build_status=1
            fi
            if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -q 'application-debuggable'; then
              echo "Release APK must not be debuggable" >> /tmp/device-share-android-build.log
              build_status=1
            fi
          fi
          echo "status=$build_status" >> "$GITHUB_OUTPUT"
          tail -n 180 /tmp/device-share-android-build.log
          exit 0
      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-share-hub-android-build-log
          path: /tmp/device-share-android-build.log
      - name: Upload signed release APK
        if: steps.android_compile.outputs.status == '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-share-hub-android-release
          path: tools/device-share-hub/android/app/build/outputs/apk/release/app-release.apk
      - name: Fail when Android build failed
        if: steps.android_compile.outputs.status != '0'
        run: exit 1

  ios-altstore-build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: tools/device-share-hub/ios
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned iPhone app
        id: ios_compile
        shell: bash
        run: |
          set +e
          simulator_id=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          print(next((d["udid"] for devices in data["devices"].values() for d in devices if d.get("isAvailable") and d["name"].startswith("iPhone")), ""))
          ')
          if [ -n "$simulator_id" ]; then
            xcodebuild \
              -project Album.xcodeproj \
              -scheme Album \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination "id=$simulator_id" \
              test > "$RUNNER_TEMP/device-share-ios-build.log" 2>&1
            test_status=$?
          else
            echo "No bootable iPhone simulator on this runner; compiling the app and test bundle." > "$RUNNER_TEMP/device-share-ios-build.log"
            xcodebuild \
              -project Album.xcodeproj \
              -scheme Album \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              build-for-testing >> "$RUNNER_TEMP/device-share-ios-build.log" 2>&1
            test_status=$?
          fi
          xcodebuild \
            -project Album.xcodeproj \
            -scheme Album \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build >> "$RUNNER_TEMP/device-share-ios-build.log" 2>&1
          build_status=$?
          if [ "$test_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then status=1; else status=0; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 180 "$RUNNER_TEMP/device-share-ios-build.log"
          exit 0
      - name: Package AltStore IPA
        if: steps.ios_compile.outputs.status == '0'
        shell: bash
        run: |
          app_path="build/Build/Products/Release-iphoneos/Album.app"
          test -d "$app_path"
          rm -rf package
          mkdir -p package/Payload
          ditto "$app_path" "package/Payload/Album.app"
          (cd package && /usr/bin/zip -qry ../album-iOS-v0.6.8-altstore.ipa Payload)
          python3 - <<'PY'
          import plistlib
          import zipfile

          ipa = "album-iOS-v0.6.8-altstore.ipa"
          with zipfile.ZipFile(ipa) as archive:
              names = archive.namelist()
              assert "Payload/Album.app/Album" in names, "iOS executable missing"
              assert all(name.isascii() for name in names), "IPA contains non-ASCII paths"
              info = plistlib.loads(archive.read("Payload/Album.app/Info.plist"))
              assert info["CFBundleExecutable"] == "Album"
              assert info["CFBundleDisplayName"] == "相册"
              assert info["CFBundleShortVersionString"] == "0.6.8"
              assert info["CFBundleVersion"] == "27"
          print("IPA structure verified")
          PY
          shasum -a 256 album-iOS-v0.6.8-altstore.ipa > album-iOS-v0.6.8-altstore.ipa.sha256
      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-share-hub-ios-build-log
          path: ${{ runner.temp }}/device-share-ios-build.log
      - name: Upload AltStore IPA
        if: steps.ios_compile.outputs.status == '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: album-ios-altstore-v0.6.8
          path: |
            tools/device-share-hub/ios/album-iOS-v0.6.8-altstore.ipa
            tools/device-share-hub/ios/album-iOS-v0.6.8-altstore.ipa.sha256
      - name: Fail when iOS build failed
        if: steps.ios_compile.outputs.status != '0'
        run: exit 1
