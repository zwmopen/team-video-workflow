name: Device Share Hub

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/device-share-hub/**'
      - '.github/workflows/device-share-hub.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/device-share-hub/**'
      - '.github/workflows/device-share-hub.yml'

jobs:
  remote-relay-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/device-share-hub/remote-relay
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/device-share-hub/remote-relay/package-lock.json
      - name: Install exact relay dependencies
        run: npm ci
      - name: Audit, test and validate relay package
        run: |
          npm audit --audit-level=high
          npm run check
          npm run typecheck
          npm test
          npx wrangler deploy --dry-run
      - name: Exercise local Worker, Durable Object and R2
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --port 8791 > "$RUNNER_TEMP/device-share-relay.log" 2>&1 &
          relay_pid=$!
          trap 'kill "$relay_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8791/v1/health >/dev/null; then
              break
            fi
            if ! kill -0 "$relay_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/device-share-relay.log"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8791/v1/health >/dev/null
          npm run test:http || {
            cat "$RUNNER_TEMP/device-share-relay.log"
            exit 1
          }

  windows-portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build native Windows panel
        id: windows_compile
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP/device-share-windows-build.log"
          cmake -S tools/device-share-hub/windows-native -B tools/device-share-hub/windows-native/build -G "Visual Studio 17 2022" -A x64 *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            "status=1" >> $env:GITHUB_OUTPUT
            exit 0
          }
          cmake --build tools/device-share-hub/windows-native/build --config Release *>&1 | Tee-Object -FilePath $log -Append
          $status = $LASTEXITCODE
          if ($status -eq 0) {
            ctest --test-dir tools/device-share-hub/windows-native/build -C Release --output-on-failure *>&1 | Tee-Object -FilePath $log -Append
            $status = $LASTEXITCODE
          }
          "status=$status" >> $env:GITHUB_OUTPUT
          if ($status -eq 0) {
            New-Item -ItemType Directory -Force -Path tools/device-share-hub/windows-native/out | Out-Null
            $version = (Select-String -Path tools/device-share-hub/windows-native/src/main.cpp -Pattern 'APP_VERSION\[\]\s*=\s*L"([^"]+)"').Matches.Groups[1].Value
            if ([string]::IsNullOrWhiteSpace($version)) { throw "Windows APP_VERSION not found" }
            Copy-Item "tools/device-share-hub/windows-native/build/Release/素材投送中控.exe" "tools/device-share-hub/windows-native/out/文件收发中控-Windows-V$version.exe"
            Copy-Item "tools/device-share-hub/README.md" "tools/device-share-hub/windows-native/out/使用说明.md"
          }
          exit 0
      - name: Upload Windows build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-share-hub-windows-build-log
          path: ${{ runner.temp }}/device-share-windows-build.log
      - name: Upload Windows portable panel
        if: steps.windows_compile.outputs.status == '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-share-hub-windows-portable
          path: tools/device-share-hub/windows-native/out/
      - name: Fail when Windows build failed
        if: steps.windows_compile.outputs.status != '0'
        run: exit 1

  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/device-share-hub/android
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@07976c6290703d34c16d382cb36445f98bb43b1f # v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install Gradle 9.4.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.4.1-bin.zip -o /tmp/gradle-9.4.1-bin.zip
          unzip -q /tmp/gradle-9.4.1-bin.zip -d /tmp/gradle
      - name: Test, build and lint Android release APK
        id: android_compile
        shell: bash
        run: |
          set +e
          /tmp/gradle/gradle-9.4.1/bin/gradle :app:testDebugUnitTest :app:assembleRelease :app:lintRelease --stacktrace > /tmp/device-share-android-build.log 2>&1
          build_status=$?
          if [ "$build_status" -eq 0 ]; then
            apk="app/build/outputs/apk/release/app-release.apk"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk" >> /tmp/device-share-android-build.log 2>&1
            if ! "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk" | grep -q 'android.permission.REQUEST_INSTALL_PACKAGES'; then
              echo "Release APK must declare REQUEST_INSTALL_PACKAGES for the verified app-owned installer" >> /tmp/device-share-android-build.log
              build_status=1
            fi
            if ! "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk" | grep -q 'android.permission.FOREGROUND_SERVICE_DATA_SYNC'; then
              echo "Release APK must declare FOREGROUND_SERVICE_DATA_SYNC for the update service" >> /tmp/device-share-android-build.log
              build_status=1
            fi
            if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk" | grep -q "uses-permission: name='android.permission.INSTALL_PACKAGES'"; then
              echo "Release APK must not declare privileged INSTALL_PACKAGES" >> /tmp/device-share-android-build.log
              build_status=1
            fi
            if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -q 'application-debuggable'; then
              echo "Release APK must not be debuggable" >> /tmp/device-share-android-build.log
              build_status=1
            fi
            if [ "$build_status" -eq 0 ]; then
              metadata="app/build/outputs/apk/release/output-metadata.json"
              version_name=$(jq -r '.elements[0].versionName' "$metadata")
              version_code=$(jq -r '.elements[0].versionCode' "$metadata")
              if [ -z "$version_name" ] || [ "$version_name" = "null" ] || [ -z "$version_code" ] || [ "$version_code" = "null" ]; then
                echo "Android output metadata does not contain versionName/versionCode" >> /tmp/device-share-android-build.log
                build_status=1
              else
                mkdir -p out
                apk_name="album-Android-v${version_name}.apk"
                cp "$apk" "out/$apk_name"
                sha256=$(sha256sum "out/$apk_name" | awk '{print $1}')
                printf '%s  %s\n' "$sha256" "$apk_name" > out/SHA256SUMS.txt
                jq -n \
                  --arg version_name "$version_name" \
                  --argjson version_code "$version_code" \
                  --arg file_name "$apk_name" \
                  --arg sha256 "$sha256" \
                  '{schema: 1, version_name: $version_name, version_code: $version_code, file_name: $file_name, sha256: $sha256}' \
                  > out/android-release-metadata.json
              fi
            fi
          fi
          echo "status=$build_status" >> "$GITHUB_OUTPUT"
          tail -n 180 /tmp/device-share-android-build.log
          exit 0
      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-share-hub-android-build-log
          path: /tmp/device-share-android-build.log
      - name: Upload signed release APK
        if: steps.android_compile.outputs.status == '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-share-hub-android-release
          path: tools/device-share-hub/android/out/
      - name: Fail when Android build failed
        if: steps.android_compile.outputs.status != '0'
        run: exit 1

  ios-altstore-build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: tools/device-share-hub/ios
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned iPhone app
        id: ios_compile
        shell: bash
        run: |
          set +e
          simulator_id=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          print(next((d["udid"] for devices in data["devices"].values() for d in devices if d.get("isAvailable") and d["name"].startswith("iPhone")), ""))
          ')
          if [ -n "$simulator_id" ]; then
            xcodebuild \
              -project Album.xcodeproj \
              -scheme Album \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination "id=$simulator_id" \
              test > "$RUNNER_TEMP/device-share-ios-build.log" 2>&1
            test_status=$?
          else
            echo "No bootable iPhone simulator on this runner; compiling the app and test bundle." > "$RUNNER_TEMP/device-share-ios-build.log"
            xcodebuild \
              -project Album.xcodeproj \
              -scheme Album \
              -configuration Debug \
              -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              build-for-testing >> "$RUNNER_TEMP/device-share-ios-build.log" 2>&1
            test_status=$?
          fi
          xcodebuild \
            -project Album.xcodeproj \
            -scheme Album \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build >> "$RUNNER_TEMP/device-share-ios-build.log" 2>&1
          build_status=$?
          if [ "$test_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then status=1; else status=0; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 180 "$RUNNER_TEMP/device-share-ios-build.log"
          exit 0
      - name: Package AltStore IPA
        if: steps.ios_compile.outputs.status == '0'
        shell: bash
        run: |
          app_path="build/Build/Products/Release-iphoneos/Album.app"
          test -d "$app_path"
          rm -rf package
          mkdir -p package/Payload
          ditto "$app_path" "package/Payload/Album.app"
          (cd package && /usr/bin/zip -qry ../album-iOS-v0.6.10-altstore.ipa Payload)
          python3 - <<'PY'
          import plistlib
          import zipfile

          ipa = "album-iOS-v0.6.10-altstore.ipa"
          with zipfile.ZipFile(ipa) as archive:
              names = archive.namelist()
              assert "Payload/Album.app/Album" in names, "iOS executable missing"
              assert all(name.isascii() for name in names), "IPA contains non-ASCII paths"
              info = plistlib.loads(archive.read("Payload/Album.app/Info.plist"))
              assert info["CFBundleExecutable"] == "Album"
              assert info["CFBundleDisplayName"] == "相册"
              assert info["CFBundleShortVersionString"] == "0.6.10"
              assert info["CFBundleVersion"] == "29"
          print("IPA structure verified")
          PY
          shasum -a 256 album-iOS-v0.6.10-altstore.ipa > album-iOS-v0.6.10-altstore.ipa.sha256
      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-share-hub-ios-build-log
          path: ${{ runner.temp }}/device-share-ios-build.log
      - name: Upload AltStore IPA
        if: steps.ios_compile.outputs.status == '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: album-ios-altstore-v0.6.10
          path: |
            tools/device-share-hub/ios/album-iOS-v0.6.10-altstore.ipa
            tools/device-share-hub/ios/album-iOS-v0.6.10-altstore.ipa.sha256
      - name: Fail when iOS build failed
        if: steps.ios_compile.outputs.status != '0'
        run: exit 1

  publish-gallery-updates:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows-portable, android-build, ios-altstore-build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: device-share-hub-android-release
          path: release/android
      - name: Download Windows portable bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: device-share-hub-windows-portable
          path: release/windows
      - name: Download iOS AltStore bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: album-ios-altstore-v0.6.10
          path: release/ios
      - name: Publish one verified Android version to gallery-updates
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GALLERY_UPDATES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing GALLERY_UPDATES_TOKEN. Add a repo-scoped token with write access to zwmopen/gallery-updates."
            exit 1
          fi

          metadata="release/android/android-release-metadata.json"
          apk_name=$(jq -r '.file_name' "$metadata")
          version_name=$(jq -r '.version_name' "$metadata")
          version_code=$(jq -r '.version_code' "$metadata")
          sha256=$(jq -r '.sha256' "$metadata")
          apk="release/android/$apk_name"
          sums="release/android/SHA256SUMS.txt"
          test -f "$apk"
          test -f "$sums"
          test "$(sha256sum "$apk" | awk '{print $1}')" = "$sha256"

          repo="zwmopen/gallery-updates"
          tag="v${version_name}"
          apk_url="https://github.com/${repo}/releases/download/${tag}/${apk_name}"
          if ! gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$repo" --title "Android ${version_name}" \
              --notes "Published from zwmopen/team-video-workflow commit ${GITHUB_SHA}. Android versionCode=${version_code}."
          fi
          gh release upload "$tag" --repo "$repo" "$apk" "$sums" --clobber

          current_json=$(curl --fail --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/${repo}/main/latest.json" || printf '{}')
          updated_json=$(printf '%s' "$current_json" | jq \
            --arg version_name "$version_name" \
            --argjson version_code "$version_code" \
            --arg sha256 "$sha256" \
            --arg apk_url "$apk_url" \
            --arg tag_name "$tag" \
            --arg html_url "https://github.com/${repo}/releases/tag/${tag}" \
            '.version_name=$version_name | .version_code=$version_code | .sha256=$sha256 | .apk_url=$apk_url | .tag_name=$tag_name | .html_url=$html_url')
          content=$(printf '%s' "$updated_json" | base64 -w0)
          latest_sha=$(gh api "repos/${repo}/contents/latest.json" --jq '.sha' 2>/dev/null || true)
          if [ -n "$latest_sha" ]; then
            gh api --method PUT "repos/${repo}/contents/latest.json" \
              --field message="release: publish Android ${version_name}" \
              --field branch=main \
              --field content="$content" \
              --field sha="$latest_sha" >/dev/null
          else
            gh api --method PUT "repos/${repo}/contents/latest.json" \
              --field message="release: publish Android ${version_name}" \
              --field branch=main \
              --field content="$content" >/dev/null
          fi

          published=""
          for attempt in $(seq 1 10); do
            published_b64=$(gh api "repos/${repo}/contents/latest.json?ref=main" --jq '.content' 2>/dev/null | tr -d '\n' || true)
            if [ -n "$published_b64" ]; then
              published=$(printf '%s' "$published_b64" | base64 --decode 2>/dev/null || true)
            fi
            if [ "$(printf '%s' "$published" | jq -r '.version_name' 2>/dev/null || true)" = "$version_name" ] \
              && [ "$(printf '%s' "$published" | jq -r '.version_code' 2>/dev/null || true)" = "$version_code" ] \
              && [ "$(printf '%s' "$published" | jq -r '.sha256' 2>/dev/null || true)" = "$sha256" ]; then
              break
            fi
            if [ "$attempt" -lt 10 ]; then
              sleep 2
            fi
          done
          test "$(printf '%s' "$published" | jq -r '.version_name')" = "$version_name"
          test "$(printf '%s' "$published" | jq -r '.version_code')" = "$version_code"
          test "$(printf '%s' "$published" | jq -r '.sha256')" = "$sha256"
          raw_version=$(curl --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/${repo}/main/latest.json?run=${GITHUB_RUN_ID}" \
            | jq -r '.version_name' || true)
          if [ "$raw_version" != "$version_name" ]; then
            echo "::warning::Contents API is current; raw.githubusercontent.com is still propagating (read ${raw_version:-unavailable})."
          fi
          echo "Published and API-verified Android ${version_name} (versionCode ${version_code}) to ${repo}."
