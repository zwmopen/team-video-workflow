name: Live Studio Standalone App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/live-studio-app/**'
      - '.github/workflows/live-studio-app.yml'
      - '!tools/live-studio-app/**/*.md'

jobs:
  android-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: tools/live-studio-app/android
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            tools/live-studio-app/android/**/*.gradle*
            tools/live-studio-app/android/gradle.properties
      - name: Install Android commandlinetools & SDK 36
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' > /dev/null
      - name: Install Gradle 9.4.1
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.4.1-bin.zip -o /tmp/gradle-9.4.1-bin.zip
          unzip -q /tmp/gradle-9.4.1-bin.zip -d /tmp/gradle
      - name: Test, build and lint release APK
        run: |
          set -euo pipefail
          /tmp/gradle/gradle-9.4.1/bin/gradle :app:testDebugUnitTest :app:assembleRelease :app:lintRelease --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/LiveStudio-Android-v1.0.0.apk
          (cd out && sha256sum LiveStudio-Android-v1.0.0.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-studio-android-v1.0.0
          path: tools/live-studio-app/android/out/

  ios-altstore-build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: tools/live-studio-app/ios
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project LiveStudio.xcodeproj \
            -scheme LiveStudio \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package AltStore IPA
        run: |
          set -euo pipefail
          app_path="build/Build/Products/Release-iphoneos/LiveStudio.app"
          test -d "$app_path"
          ipa_name="LiveStudio-iOS-v1.0.0-altstore.ipa"
          rm -rf package
          mkdir -p package/Payload
          ditto "$app_path" "package/Payload/LiveStudio.app"
          (cd package && /usr/bin/zip -qry "../$ipa_name" Payload)
          python3 - <<'PY'
          import plistlib, zipfile
          with zipfile.ZipFile("LiveStudio-iOS-v1.0.0-altstore.ipa") as z:
              info = plistlib.loads(z.read("Payload/LiveStudio.app/Info.plist"))
              assert info["CFBundleExecutable"] == "LiveStudio"
              assert info["CFBundleDisplayName"] == "实况工坊"
              assert info["CFBundleShortVersionString"] == "1.0.0"
          print("LiveStudio IPA verified")
          PY
          shasum -a 256 "$ipa_name" > "${ipa_name}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-studio-ios-altstore-v1.0.0
          path: |
            tools/live-studio-app/ios/LiveStudio-iOS-v1.0.0-altstore.ipa
            tools/live-studio-app/ios/LiveStudio-iOS-v1.0.0-altstore.ipa.sha256
