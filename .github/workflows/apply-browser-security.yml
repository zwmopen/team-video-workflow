name: Apply local browser API security patch

on:
  pull_request:
    paths:
      - "APPLY_BROWSER_SECURITY.md"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'automation/apply-browser-security'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/browser-local-api-security
          fetch-depth: 0

      - name: Apply exact browser security patch
        run: |
          set -euo pipefail
          cat .browser-security-patch/part* > /tmp/browser-security.patch
          git apply --check /tmp/browser-security.patch
          git apply /tmp/browser-security.patch

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate local API security
        run: |
          python -m py_compile tools/team-video-library-browser/server.py
          python -m unittest tests.test_browser_server_security -v
          python - <<'PY'
          from pathlib import Path
          source = Path('tools/team-video-library-browser/server.py').read_text(encoding='utf-8-sig')
          required = [
              'is_trusted_local_request',
              'MAX_JSON_BODY_BYTES = 1024 * 1024',
              'Cross-Origin-Resource-Policy',
              'resolve_allowed_file',
              'confirm:"RENAME"',
              'confirm:"RECYCLE"',
              'write_json_atomically',
          ]
          for marker in required:
              if marker not in source:
                  raise SystemExit(f'Missing browser security marker: {marker}')
          PY
          git diff --check

      - name: Commit verified changes
        run: |
          set -euo pipefail
          rm -rf .browser-security-patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: secure the local media browser API"
          git push origin HEAD:fix/browser-local-api-security
