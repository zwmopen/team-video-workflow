<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>素材投送中控</title>
  <style>
    :root { color-scheme: light; --bg:#f3f5f7; --card:#fff; --ink:#15171a; --muted:#68707a; --line:#dfe3e8; --accent:#15171a; --ok:#168a4a; --warn:#b26a00; --bad:#bf2f2f; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); }
    header { position:sticky; top:0; z-index:5; background:rgba(243,245,247,.94); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
    .bar { max-width:1180px; margin:auto; padding:18px 24px; display:flex; gap:16px; align-items:center; justify-content:space-between; }
    h1 { font-size:22px; margin:0; }
    .sub { color:var(--muted); font-size:13px; margin-top:3px; }
    .badge { display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:999px; padding:7px 11px; background:#fff; font-size:13px; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 4px #168a4a18; }
    main { max-width:1180px; margin:0 auto; padding:24px; }
    .setup, .composer { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; margin-bottom:18px; }
    .setup-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .label { color:var(--muted); font-size:12px; margin-bottom:6px; }
    code, .mono { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; }
    .copybox { display:flex; gap:8px; }
    input, textarea, button { font:inherit; }
    input, textarea { width:100%; border:1px solid var(--line); border-radius:12px; padding:11px 12px; background:#fff; }
    textarea { min-height:82px; resize:vertical; }
    button { border:0; border-radius:11px; padding:10px 14px; cursor:pointer; background:var(--accent); color:#fff; }
    button.secondary { background:#eef1f4; color:var(--ink); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .section-title { display:flex; align-items:end; justify-content:space-between; margin:22px 0 12px; }
    .section-title h2 { margin:0; font-size:18px; }
    .section-title span { color:var(--muted); font-size:13px; }
    #devices { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
    .device { min-height:166px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:17px; transition:.16s ease; position:relative; overflow:hidden; }
    .device.online { border-color:#b9dfca; }
    .device.drag { transform:translateY(-2px); border:2px dashed var(--ink); background:#fbfcfd; }
    .device-head { display:flex; justify-content:space-between; gap:10px; }
    .device-name { font-weight:750; font-size:17px; }
    .status { font-size:12px; padding:5px 8px; border-radius:999px; background:#f0f2f4; color:var(--muted); height:max-content; }
    .online .status { background:#e9f8ef; color:var(--ok); }
    .meta { color:var(--muted); font-size:13px; line-height:1.7; margin:10px 0 16px; }
    .drop-hint { border:1px dashed #bdc4cc; color:var(--muted); border-radius:12px; padding:12px; text-align:center; font-size:13px; }
    .offline { opacity:.62; }
    .empty { padding:36px; border:1px dashed #bac1c9; border-radius:18px; text-align:center; color:var(--muted); background:#fff; }
    #tasks { display:flex; flex-direction:column; gap:9px; }
    .task { background:#fff; border:1px solid var(--line); border-radius:14px; padding:13px 15px; display:grid; grid-template-columns:1.3fr .8fr .7fr auto; gap:14px; align-items:center; font-size:13px; }
    .task strong { display:block; font-size:14px; margin-bottom:3px; }
    .task .muted { color:var(--muted); }
    .pill { justify-self:start; border-radius:999px; padding:5px 9px; background:#eef1f4; }
    .pill.shared,.pill.ready { background:#e9f8ef; color:var(--ok); }
    .pill.failed { background:#fff0f0; color:var(--bad); }
    .pill.queued,.pill.delivering,.pill.downloading { background:#fff5df; color:var(--warn); }
    #toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px); opacity:0; pointer-events:none; background:#15171a; color:#fff; border-radius:12px; padding:11px 15px; transition:.2s; z-index:20; max-width:min(90vw,620px); }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .progress { height:6px; background:#edf0f2; border-radius:99px; overflow:hidden; margin-top:10px; display:none; }
    .progress > div { height:100%; width:0; background:#15171a; transition:width .15s; }
    @media (max-width:760px) { .setup-grid { grid-template-columns:1fr; } .task { grid-template-columns:1fr; } .bar { align-items:flex-start; } }
  </style>
</head>
<body>
<header><div class="bar"><div><h1>素材投送中控</h1><div class="sub">把图片或视频拖到手机在线卡片，手机会接收并调起安卓分享。</div></div><div class="badge"><span class="dot"></span><span id="serverName">本机服务</span></div></div></header>
<main>
  <section class="setup">
    <div class="setup-grid">
      <div><div class="label">手机端填写的电脑地址（同一 Wi‑Fi）</div><div class="copybox"><input id="pairUrl" class="mono" readonly /><button class="secondary" data-copy="pairUrl">复制</button></div></div>
      <div><div class="label">配对令牌</div><div class="copybox"><input id="pairToken" class="mono" readonly /><button class="secondary" data-copy="pairToken">复制</button></div></div>
    </div>
  </section>

  <section class="composer">
    <div class="label">可选文案（发送时同步到手机剪贴板，也会作为分享文字附带）</div>
    <textarea id="shareText" placeholder="不需要同步文案时留空。你已有剪贴板同步，也可以只拖图片。"></textarea>
    <div class="progress" id="progress"><div></div></div>
  </section>

  <div class="section-title"><h2>在线设备</h2><span id="deviceSummary">正在读取…</span></div>
  <section id="devices"><div class="empty">手机端启动“保持在线”后，会显示在这里。</div></section>

  <div class="section-title"><h2>最近任务</h2><span>文件仅在电脑与手机私有缓存中流转</span></div>
  <section id="tasks"><div class="empty">还没有投送任务。</div></section>
</main>
<input id="filePicker" type="file" multiple accept="image/*,video/*" hidden />
<div id="toast"></div>
<script>
  const state = { token:'', devices:[], selectedDevice:null, uploading:false };
  const $ = (id) => document.getElementById(id);
  const statusName = { uploading:'上传中', queued:'等待手机', delivering:'手机接收中', downloading:'下载中', ready:'待分享', shared:'已打开分享', failed:'失败' };

  function toast(message) { const el=$('toast'); el.textContent=message; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2600); }
  async function api(path, options={}) {
    const headers = new Headers(options.headers || {}); headers.set('authorization', `Bearer ${state.token}`);
    if (options.body && typeof options.body === 'string' && !headers.has('content-type')) headers.set('content-type','application/json');
    const response = await fetch(path, { ...options, headers });
    const type = response.headers.get('content-type') || '';
    const data = type.includes('application/json') ? await response.json() : await response.text();
    if (!response.ok) throw new Error(data.error || data || `HTTP ${response.status}`);
    return data;
  }
  function escapeHtml(value='') { return String(value).replace(/[&<>'"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
  function fileSize(size=0) { if(size<1024) return `${size} B`; if(size<1048576) return `${(size/1024).toFixed(1)} KB`; return `${(size/1048576).toFixed(1)} MB`; }
  function timeText(iso) { try { return new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',month:'2-digit',day:'2-digit'}).format(new Date(iso)); } catch { return ''; } }

  async function loadConfig() {
    const response = await fetch('/api/local/config');
    const config = await response.json();
    state.token = config.token; $('serverName').textContent=config.serverName;
    $('pairToken').value=config.token;
    $('pairUrl').value=config.urls.find(url=>!url.includes('127.0.0.1')) || config.urls[0];
  }

  async function refreshDevices() {
    try {
      const {devices} = await api('/api/devices'); state.devices=devices;
      const online = devices.filter(d=>d.online);
      $('deviceSummary').textContent=`${online.length} 台在线 / ${devices.length} 台已配对`;
      $('devices').innerHTML = devices.length ? devices.map(device=>`
        <article class="device ${device.online?'online':'offline'}" data-device="${escapeHtml(device.deviceId)}">
          <div class="device-head"><div><div class="device-name">${escapeHtml(device.name)}</div><div class="meta">${escapeHtml(device.model || 'Android 手机')} · Android ${escapeHtml(device.androidVersion || '-')}<br>最后在线：${escapeHtml(timeText(device.lastSeen))}</div></div><span class="status">${device.online?'在线':'离线'}</span></div>
          <div class="drop-hint">${device.online?'拖入图片/视频，或点击选择文件':'设备离线，启动手机端在线服务'}</div>
        </article>`).join('') : '<div class="empty">手机端启动“保持在线”后，会显示在这里。</div>';
      bindDeviceCards();
    } catch (error) { $('deviceSummary').textContent=error.message; }
  }

  function bindDeviceCards() {
    document.querySelectorAll('.device.online').forEach(card=>{
      const id=card.dataset.device;
      ['dragenter','dragover'].forEach(name=>card.addEventListener(name,e=>{e.preventDefault(); card.classList.add('drag');}));
      ['dragleave','drop'].forEach(name=>card.addEventListener(name,e=>{e.preventDefault(); card.classList.remove('drag');}));
      card.addEventListener('drop',e=>sendFiles(id,[...e.dataTransfer.files]));
      card.addEventListener('click',()=>{ if(state.uploading)return; state.selectedDevice=id; $('filePicker').click(); });
    });
  }

  $('filePicker').addEventListener('change',()=>{ const files=[...$('filePicker').files]; $('filePicker').value=''; if(state.selectedDevice) sendFiles(state.selectedDevice,files); });

  async function sendFiles(deviceId, files) {
    files = files.filter(file=>file.type.startsWith('image/') || file.type.startsWith('video/'));
    if(!files.length) return toast('请选择图片或视频');
    if(state.uploading) return toast('上一批仍在上传');
    state.uploading=true; const bar=$('progress'); const fill=bar.firstElementChild; bar.style.display='block'; fill.style.width='2%';
    try {
      const created = await api('/api/tasks',{method:'POST',body:JSON.stringify({deviceId,text:$('shareText').value,files:files.map(f=>({name:f.name,mime:f.type,size:f.size}))})});
      let sent=0; const total=files.reduce((sum,f)=>sum+f.size,0) || 1;
      for(let i=0;i<files.length;i++) {
        const file=files[i];
        await api(`/api/tasks/${encodeURIComponent(created.task.id)}/files/${i}`,{method:'PUT',headers:{'content-type':file.type||'application/octet-stream'},body:file});
        sent += file.size; fill.style.width=`${Math.max(4,Math.round(sent/total*92))}%`;
      }
      await api(`/api/tasks/${encodeURIComponent(created.task.id)}/commit`,{method:'POST'});
      fill.style.width='100%'; toast(`已投送 ${files.length} 个文件，等待手机接收`); await refreshTasks();
    } catch(error) { toast(`投送失败：${error.message}`); }
    finally { state.uploading=false; setTimeout(()=>{bar.style.display='none'; fill.style.width='0';},700); }
  }

  async function refreshTasks() {
    try {
      const {tasks}=await api('/api/tasks?limit=30');
      const deviceMap=new Map(state.devices.map(d=>[d.deviceId,d.name]));
      $('tasks').innerHTML=tasks.length?tasks.map(task=>`
        <div class="task"><div><strong>${escapeHtml(deviceMap.get(task.deviceId)||task.deviceId)}</strong><span class="muted">${task.files.length} 个文件 · ${fileSize(task.files.reduce((s,f)=>s+(f.size||0),0))}</span></div>
        <div class="muted">${escapeHtml(timeText(task.createdAt))}</div><div><span class="pill ${escapeHtml(task.status)}">${escapeHtml(statusName[task.status]||task.status)}</span>${task.error?`<div class="muted">${escapeHtml(task.error)}</div>`:''}</div>
        <div>${task.status==='failed'?`<button class="secondary retry" data-id="${escapeHtml(task.id)}">重试</button>`:''}</div></div>`).join(''):'<div class="empty">还没有投送任务。</div>';
      document.querySelectorAll('.retry').forEach(button=>button.addEventListener('click',async()=>{try{await api(`/api/tasks/${encodeURIComponent(button.dataset.id)}/retry`,{method:'POST'});toast('已重新排队');refreshTasks();}catch(e){toast(e.message);}}));
    } catch(error) { console.error(error); }
  }

  document.querySelectorAll('[data-copy]').forEach(button=>button.addEventListener('click',async()=>{ const input=$(button.dataset.copy); await navigator.clipboard.writeText(input.value); toast('已复制'); }));

  await loadConfig(); await refreshDevices(); await refreshTasks();
  setInterval(refreshDevices,2500); setInterval(refreshTasks,2500);
</script>
</body>
</html>
