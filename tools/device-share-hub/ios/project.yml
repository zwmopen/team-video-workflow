name: Album
options:
  bundleIdPrefix: com.zwm
  deploymentTarget:
    iOS: "12.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Album:
    type: application
    platform: iOS
    sources:
      - path: Album
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zwm.album
        # Keep bundle/executable paths ASCII-only. The user-facing name stays Chinese
        # via CFBundleDisplayName, avoiding IPA ZIP filename encoding failures.
        PRODUCT_NAME: Album
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 6
        MARKETING_VERSION: 0.2.0
    info:
      path: Album/Info.plist
      properties:
        CFBundleDisplayName: 相册
        CFBundleName: Album
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "6"
        LSApplicationCategoryType: public.app-category.productivity
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  AlbumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AlbumTests
    dependencies:
      - target: Album
