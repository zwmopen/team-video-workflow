name: Album
options:
  bundleIdPrefix: com.zwm
  deploymentTarget:
    iOS: "12.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Album:
    type: application
    platform: iOS
    sources:
      - path: Album
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zwm.album
        # Keep bundle/executable paths ASCII-only. The user-facing name stays Chinese
        # via CFBundleDisplayName, avoiding IPA ZIP filename encoding failures.
        PRODUCT_NAME: Album
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 28
        MARKETING_VERSION: 0.6.9
        SWIFT_OBJC_BRIDGING_HEADER: Album/Album-Bridging-Header.h
        OTHER_LDFLAGS: "$(inherited) -lz"
    info:
      path: Album/Info.plist
      properties:
        CFBundleDisplayName: 相册
        CFBundleName: Album
        CFBundleShortVersionString: "0.6.9"
        CFBundleVersion: "28"
        NSLocalNetworkUsageDescription: 用于让同一 Wi-Fi 的素材投送中控自动发现这台 iPhone，并把文件直接传入所选作品文件夹。
        NSPhotoLibraryUsageDescription: 用于在你开启“自动识别新截图”后，回到相册时识别刚保存的截图并发送到所选主设备。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LSApplicationCategoryType: public.app-category.productivity
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  AlbumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AlbumTests
    dependencies:
      - target: Album
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
