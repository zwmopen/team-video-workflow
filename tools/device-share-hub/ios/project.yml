name: Album
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 126.0.0
options:
  bundleIdPrefix: com.zwm
  deploymentTarget:
    iOS: "12.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Album:
    type: application
    platform: iOS
    sources:
      - path: Album
    dependencies:
      - package: WebRTC
        product: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zwm.album
        # Keep bundle/executable paths ASCII-only. The user-facing name stays Chinese
        # via CFBundleDisplayName, avoiding IPA ZIP filename encoding failures.
        PRODUCT_NAME: Album
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 94
        MARKETING_VERSION: 0.8.23
        SWIFT_OBJC_BRIDGING_HEADER: Album/Album-Bridging-Header.h
        OTHER_LDFLAGS: "$(inherited) -lz"
    info:
      path: Album/Info.plist
      properties:
        CFBundleDisplayName: 相册
        CFBundleName: Album
        # ⚠️ 单一版本源：这两个值必须引用上面的 MARKETING_VERSION / CURRENT_PROJECT_VERSION，
        # 不要再硬编码字面量。2026-09-20 踩过坑：settings 里升到 0.8.17/88，这里还留着
        # 硬编码的 "0.8.16"/"87"，xcodegen 用它覆盖了 Info.plist，打出来的 IPA 版本与
        # CI 断言不一致，iOS 产物直接发不出去（android-build 却是绿的，极易误判）。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: 用于让同一 Wi-Fi 的素材投送中控自动发现这台 iPhone，并把文件直接传入所选作品文件夹。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        LSApplicationCategoryType: public.app-category.productivity
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  AlbumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AlbumTests
    dependencies:
      - target: Album
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
